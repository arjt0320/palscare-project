# ==============================================================================
# PalsCare Microservices Ecosystem - Docker Compose Orchestration
# ==============================================================================
# Purpose:
#   This file spins up supporting infrastructure services for the PalsCare
#   healthcare platform:
#     1. MongoDB (NoSQL database engine storing users, doctors, chambers, slots,
#        appointments, and payment audits across all microservices).
#     2. RabbitMQ (Message broker for asynchronous inter-service events).
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Step 1: MongoDB Database Service
  # ----------------------------------------------------------------------------
  # - Image: Official MongoDB Community Edition image (mongo:6.0)
  # - Port: 27017 mapped to host for direct connection from Spring Boot microservices
  # - Persistence: Docker volume 'mongodata' ensures data survives container restarts
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: palscare-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      # Default database created on initialization
      MONGO_INITDB_DATABASE: palscare
    volumes:
      - mongodata:/data/db

  # ----------------------------------------------------------------------------
  # Step 2: RabbitMQ Message Broker
  # ----------------------------------------------------------------------------
  # - Image: RabbitMQ with management web console pre-installed
  # - Port 5672: AMQP protocol port for Spring Boot messaging
  # - Port 15672: Web management dashboard (http://localhost:15672, guest/guest)
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: palscare-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

# ------------------------------------------------------------------------------
# Persistent Volume Declarations
# ------------------------------------------------------------------------------
volumes:
  mongodata:
    driver: local
  rabbitmqdata:
    driver: local
