# ==============================================================================
# PalsCare - User Service Configuration
# Backed by MongoDB NoSQL Database
# ==============================================================================

# Step 1: Web server port configuration
server:
  port: ${PORT:8075}

spring:
  application:
    name: user-service

  # Step 2: MongoDB Connection Configuration
  data:
    mongodb:
      # Defaults directly to your MongoDB Atlas cloud cluster so it works out-of-the-box in IDE / CLI
      uri: ${USER_SERVICE_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb+srv://arjtp98:arjtp98@cluster-1.wtetsir.mongodb.net/palscare_user?retryWrites=true&w=majority&appName=cluster-1}}
      auto-index-creation: true

# Step 3: Eureka Discovery Client registration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Step 4: Application logging levels
logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework.data.mongodb: INFO
