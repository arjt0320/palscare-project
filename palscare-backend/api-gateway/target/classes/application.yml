# ==============================================================================
# PalsCare - API Gateway Configuration
# Reverse Proxy & Edge Security Routing
# ==============================================================================

# Step 1: Gateway server port (entrypoint for frontend web applications)
server:
  port: ${PORT:8088}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Step 2: Global Cross-Origin Resource Sharing (CORS) Configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false

      # Step 3: Dynamic Microservice Routing Declarations
      routes:
        # Step 3.1: Route doctor chamber and scheduling slots to doctor-slot-service
        - id: doctor-slot-service
          uri: ${DOCTOR_SLOT_SERVICE_URL:lb://doctor-slot-service}
          predicates:
            - Path=/api/v1/doctors/chambers, /api/v1/doctors/chambers/**, /api/v1/doctors/slots, /api/v1/doctors/slots/**, /api/v1/patients/doctors/*/slots
          filters:
            - RemoveRequestHeader=Cookie

        # Step 3.2: Route booking and payment transactions to booking-service
        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:lb://booking-service}
          predicates:
            - Path=/api/v1/patients/appointments, /api/v1/patients/appointments/**
          filters:
            - RemoveRequestHeader=Cookie

        # Step 3.3: Route user accounts, onboarding, and directory to user-service
        - id: user-service
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/patients/profile, /api/v1/patients/doctors, /api/v1/patients/internal/**, /api/v1/doctors/profile, /api/v1/doctors/onboarding, /api/v1/doctors/internal/**
          filters:
            - RemoveRequestHeader=Cookie

# Step 4: Eureka Service Registry Connection
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Step 5: Gateway logging levels
logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework.cloud.gateway: INFO
