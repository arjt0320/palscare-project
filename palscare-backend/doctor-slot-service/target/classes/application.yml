# ==============================================================================
# PalsCare - Doctor Slot Service Configuration
# Backed by MongoDB NoSQL Database
# ==============================================================================

# Step 1: Web server port
server:
  port: 8055

spring:
  application:
    name: doctor-slot-service

  # Step 2: MongoDB Connection
  data:
    mongodb:
      # Defaults directly to your MongoDB Atlas cloud cluster
      uri: ${DOCTOR_SLOT_SERVICE_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb+srv://arjtp98:arjtp98@cluster-1.wtetsir.mongodb.net/palscare_doctor_slot?retryWrites=true&w=majority&appName=cluster-1}}
      auto-index-creation: true

# Step 3: Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Step 4: Inter-service URLs
palscare:
  services:
    user-service:
      url: ${USER_SERVICE_URL:http://user-service}
